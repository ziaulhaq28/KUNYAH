<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kunyah - Diagnostic Assessment Gaya Hidup</title>
    <!-- Performance Optimization: Font Load Acceleration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      
      // ==========================================
      // INPUT METAPEXEL ID DI SINI (Ganti PASTE_PIXEL_ID_HERE dengan ID asli Anda)
      // ==========================================
      const META_PIXEL_ID = 'PASTE_PIXEL_ID_HERE';
      
      if (META_PIXEL_ID && META_PIXEL_ID !== 'PASTE_PIXEL_ID_HERE') {
        fbq('init', META_PIXEL_ID);
        fbq('track', 'PageView');
      } else {
        console.log('%c[Meta Pixel Debug] Pixel ID siap dikonfigurasi. Silakan cari file index.html dan ganti "PASTE_PIXEL_ID_HERE" dengan ID Pixel Anda.', 'color: #E8B100; font-weight: bold;');
      }
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <!-- Meta Pixel fallback tracker for noscript -->
    <noscript>
      <img height="1" width="1" style="display:none" 
           src="https://www.facebook.com/tr?id=PASTE_PIXEL_ID_HERE&ev=PageView&noscript=1" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
